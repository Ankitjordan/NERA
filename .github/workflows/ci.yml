name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Frontend / UI CI Checks
  # -------------------------------------------------------------
  ui-ci:
    name: UI (Frontend) Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check and build
        run: npm run build

  # -------------------------------------------------------------
  # Backend / Go Engine CI Checks
  # -------------------------------------------------------------
  backend-ci:
    name: Backend (Routing Engine) Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Routing Engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify module dependencies
        run: |
          go mod download
          go mod verify

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: |
          if ls *.go >/dev/null 2>&1 || [ -n "$(find . -name '*.go' -not -path './vendor/*')" ]; then
            go vet ./...
          else
            echo "No Go source files found yet, skipping go vet."
          fi

      - name: Build Go backend
        run: |
          if ls *.go >/dev/null 2>&1 || [ -n "$(find . -name '*.go' -not -path './vendor/*')" ]; then
            go build -v ./...
          else
            echo "No Go source files found yet, skipping go build."
          fi

      - name: Run Go tests
        run: |
          if ls *_test.go >/dev/null 2>&1 || [ -n "$(find . -name '*_test.go' -not -path './vendor/*')" ]; then
            go test -v -race -cover ./...
          else
            echo "No Go test files found yet, skipping go test."
          fi
